name: Check ASU seats

on:
  schedule:
    # Each run keeps checking every 5 minutes for ~50 minutes. Two start times
    # an hour (off the busy :00 mark) so a late or skipped GitHub run is covered.
    - cron: "7,37 * * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  issues: write
  contents: read

concurrency:
  group: seat-watcher
  cancel-in-progress: false   # a new run waits for the current one to finish

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check seats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_MINUTES: "50"
          INTERVAL_MINUTES: "5"
        run: python -u watch.py
